# =============================================================================
# 全局构建配置 —— 唯一事实来源
#
# 该文件由 lib/config.sh 加载（source），也会被 patch/*.sh 直接读取。
# 因此请保持纯 POSIX 赋值写法：只有 KEY=VALUE，不要写数组、函数或 bash 专有语法。
#
# 优先级：环境变量 > 本文件 > 脚本内默认值
#   —— 需要临时覆盖时，直接 export 同名变量即可，例如：
#        FIX_RUST=true ./diy-full.sh
#
# 修改后无需改动任何脚本；仅新增构建目标时才需要动 .github/workflows/*.yml。
# =============================================================================

# ------------------------------------------------------------------ 源码 ----
# 新增源码类型时：在这里加 SOURCE_<NAME>_URL / SOURCE_<NAME>_BRANCH，
# 并在 config/packages/<小写名>.list 中放该源码专用的插件清单。
SOURCE_LEDE_URL="https://github.com/coolsnowwolf/lede"
SOURCE_LEDE_BRANCH="master"

SOURCE_IMMORTAL_URL="https://github.com/immortalwrt/immortalwrt"
SOURCE_IMMORTAL_BRANCH="openwrt-25.12"

# ---------------------------------------------------------------- 版本号 ----
# 最终版本串形如：R25.10.31 by billyJR
VERSION_PREFIX="R"
VERSION_DATE_FORMAT="+%y.%m.%d"
VERSION_AUTHOR="billyJR"
# 写进 os-release 的发行版名称（ImmortalWrt 版本注入脚本使用）
VERSION_DISPLAY_NAME="ImmortalWrt"

# LEDE 的版本号写在默认设置文件里（脚本会按顺序找第一个存在的）
LEDE_SETTINGS_CANDIDATES="package/lean/default-settings/files/zzz-default-settings package/default-settings/files/zzz-default-settings files/etc/zzz-default-settings"
# ImmortalWrt 的版本号由 scripts/update-emortal.sh 注入该文件
IMMORTAL_SETTINGS_FILE="package/emortal/default-settings/files/99-default-settings"

# ------------------------------------------------------------------ 网络 ----
# 首次启动时写入的默认 LAN/WAN 网口（update_eth.sh 使用）
LAN_PORTS="eth1 eth2 eth3"
WAN_PORT="eth0"
DEFAULT_LAN_IP="192.168.1.1"

# ------------------------------------------------------------------ 主题 ----
THEME_DIR="feeds/luci/themes/luci-theme-argon/htdocs/luci-static/argon"
THEME_BG_SOURCE="images/background.jpg"
THEME_BG_TARGET="${THEME_DIR}/img/bg1.jpg"
# 固件首启时写入的 LuCI 主题路径。注意：该值被固化进 patch/init-settings.sh
# 并随固件运行，运行时读不到本文件，改动时请同时修改 patch/init-settings.sh。
THEME_UCI_MEDIAURL="/luci-static/argon"

# ------------------------------------------------------------ 版本修复开关 ----
# 对应 patch/fix_version_error.sh 的三个开关，workflow 的 matrix 会覆盖它们
FIX_GOLANG="false"
FIX_RUST="false"
FIX_SS_LIBEV="false"

# 修复 golang 时使用的 feed（上游 xray 需要较新的 Go）
GOLANG_FEED_URL="https://github.com/kenzok8/golang"
GOLANG_BRANCH="1.26"

# ---------------------------------------------------------------- 编译 ----
# make download 的并行度；编译并行度默认使用 $(nproc)
MAKE_DOWNLOAD_JOBS="8"
MAKE_RETRIES="3"
