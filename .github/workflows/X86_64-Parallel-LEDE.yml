# =============================================================================
# X86_64-Parallel-LEDE.yml —— 基于 Lean's LEDE 的构建（仅 Full）
#
# 构建逻辑全部在 build.yml（workflow_call），本文件只声明：
#   什么时候跑、跑哪几个目标、发布名后缀、用哪份发布说明模板。
# =============================================================================

name: X86_64 Combined LEDE (Parallel)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: 0 16 */3 * *

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      cache_action: higarfield
      release_notes: lede.md
      release_suffix: _LEDE_Combined
      targets: |
        [
          {
            "source": "LEDE", "slug": "LEDE",
            "repo_url": "https://github.com/coolsnowwolf/lede.git",
            "repo_branch": "master",
            "build_type": "Full", "firmware_prefix": "Full",
            "config": "configs/x86_64.config",
            "diy_script": "diy-full.sh",
            "fix_golang": "true", "fix_rust": "false", "fix_ss_libev": "false"
          }
        ]
