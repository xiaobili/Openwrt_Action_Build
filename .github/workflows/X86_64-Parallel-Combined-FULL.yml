# =============================================================================
# X86_64-Parallel-Combined-FULL.yml —— 双源码 FULL 版并行构建
#
# 一次运行同时产出 LEDE FULL 与 ImmortalWrt FULL，合并成一个 Release。
# 构建逻辑在 build.yml（workflow_call）。
# =============================================================================

name: X86_64 Combined LEDE & ImmortalWrt FULL (Parallel)

on:
  workflow_dispatch:
  schedule:
    - cron: 0 16 * * *

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      cache_action: xiaobili
      release_notes: full-combined.md
      release_suffix: _LEDE_ImmortalWrt_FULL_Combined
      targets: |
        [
          {
            "source": "LEDE", "slug": "LEDE",
            "repo_url": "https://github.com/coolsnowwolf/lede",
            "repo_branch": "master",
            "build_type": "FULL", "firmware_prefix": "LEDE",
            "config": "configs/x86_64.config",
            "diy_script": "diy-full.sh",
            "fix_golang": "true", "fix_rust": "false", "fix_ss_libev": "false"
          },
          {
            "source": "ImmortalWrt", "slug": "IMMORTAL",
            "repo_url": "https://github.com/immortalwrt/immortalwrt",
            "repo_branch": "openwrt-25.12",
            "build_type": "FULL", "firmware_prefix": "ImmortalWrt",
            "config": "configs/x86_64-immortalWrt.config",
            "diy_script": "diy-full.sh",
            "fix_golang": "true", "fix_rust": "true", "fix_ss_libev": "false"
          }
        ]
