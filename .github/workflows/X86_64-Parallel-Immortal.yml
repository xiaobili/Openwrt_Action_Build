# =============================================================================
# X86_64-Parallel-Immortal.yml —— 基于 ImmortalWrt 的构建（仅 Full）
#
# 构建逻辑全部在 build.yml（workflow_call），本文件只声明触发条件与目标。
# 默认在 LEDE 工作流完成后自动接续，避免两个源码同时抢 runner 与 Release 名额。
# =============================================================================

name: X86_64 Combined ImmortalWrt (Parallel)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "X86_64 Combined LEDE (Parallel)"
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      cache_action: higarfield
      release_notes: immortalwrt.md
      release_suffix: _ImmortalWrt_Combined
      targets: |
        [
          {
            "source": "ImmortalWrt", "slug": "IMMORTAL",
            "repo_url": "https://github.com/immortalwrt/immortalwrt",
            "repo_branch": "openwrt-25.12",
            "build_type": "Full", "firmware_prefix": "Full",
            "config": "configs/x86_64-immortalWrt.config",
            "diy_script": "diy-full.sh",
            "fix_golang": "false", "fix_rust": "true", "fix_ss_libev": "false"
          }
        ]
